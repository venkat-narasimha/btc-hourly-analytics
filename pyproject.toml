[project]
name = "btc-hourly-analytics-pipeline"
version = "0.1.0"
description = "BTCUSDT 1h klines ETL pipeline"
requires-python = ">=3.12"
dependencies = [
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
