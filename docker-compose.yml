services:
  etl:
    build:
      context: .
      dockerfile: docker/etl.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      - GIT_SHA=${GIT_SHA:-unknown}
    volumes:
      - artifacts:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/current/meta.json"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8080:80"
    volumes:
      - artifacts:/data:ro
    depends_on:
      etl:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  artifacts:
