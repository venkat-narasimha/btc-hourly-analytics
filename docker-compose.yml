services:
  etl:
    build:
      context: .
      dockerfile: docker/etl.Dockerfile
    volumes:
      - artifacts:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8080:80"
    volumes:
      - artifacts:/data:ro
    depends_on:
      - etl
    restart: unless-stopped

volumes:
  artifacts:
