events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip settings (parquet / octet-stream excluded to ensure range requests work cleanly)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Hashed static assets (immutable 1y)
        location ~* \.(?:css|js|woff2?|svg|png|jpg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Artifacts volume served at /data/
        location ^~ /data/ {
            alias /data/;
            autoindex off;

            # Never cache release data and metadata
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;

            # CORS headers for browser fetch / hyparquet range requests
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept" always;
            add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;
        }

        # Artifacts volume served at /btc/data/
        location ^~ /btc/data/ {
            alias /data/;
            autoindex off;

            # Never cache release data and metadata
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;

            # CORS headers for browser fetch / hyparquet range requests
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept" always;
            add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;
        }

        # Subpath SPA router fallback
        location = /btc {
            return 301 /btc/;
        }

        location /btc/ {
            try_files $uri $uri/ /btc/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # SPA router fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
    }
}
