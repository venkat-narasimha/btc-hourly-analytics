services:
  etl:
    build:
      context: .
      dockerfile: docker/etl.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      - GIT_SHA=${GIT_SHA:-unknown}
    volumes:
      - artifacts:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/current/meta.json"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s
    restart: unless-stopped
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_BASE_PATH: /btc/
    container_name: btc-web
    volumes:
      - artifacts:/data:ro
    depends_on:
      - etl
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal
      - clawb-nginx_default

networks:
  internal:
  clawb-nginx_default:
    external: true

volumes:
  artifacts:
